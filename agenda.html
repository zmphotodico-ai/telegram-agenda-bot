<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de horários · Estúdio ZM Photo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Layout: grade de um dia, igual ao Google Agenda — uma coluna por estúdio, horas descendo na lateral. Tema único claro (fica dentro do site branco). */
:root{
  --bg:#FFFFFF; --ink:#16181D; --muted:#5B616B; --line:#E3E6EA; --grid:#ECEEF1; --grid2:#F4F5F7;
  --busy:#DDE0E5; --busy-ink:#3F444C; --past:rgba(246,247,248,.78);
  --sel:#1F3FBF; --sel-soft:#EEF2FF; --free:#0E8A6E; --free-soft:#EAF6F2; --now:#D93025;
  --f-display:'Space Grotesk','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hh:56px; color-scheme:light;
}
html,body{background:var(--bg)}
html,body{margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;padding-inline:16px;padding-block:16px 28px}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;gap:6px}
.top h1{font-family:var(--f-display);font-size:28px;font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
.top p{margin:0;color:var(--muted)}
.badge{align-self:flex-start;font-size:12px;font-weight:600;color:#6B4100;background:#FFF3D9;border:1px solid #F0D49A;padding:3px 9px;border-radius:999px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;gap:4px;padding:4px;background:#F1F2F4;border-radius:12px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:#2A2E35}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#3A3F47}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:15px;height:15px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.sw.l{background:#fff;border-color:#C9CED6}.sw.o{background:var(--busy);border-color:var(--busy)}
.sw.f{background:repeating-linear-gradient(135deg,#E2E5E9 0 3px,#F6F7F8 3px 6px)}
.sw.s{background:var(--sel);border-color:var(--sel)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.days button{flex:0 0 auto;width:62px;min-height:64px;border-radius:12px;border:1px solid #D5D9DF;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.days small{font-size:12px;color:var(--muted);text-transform:capitalize}
.days b{font-size:19px;font-variant-numeric:tabular-nums}
.days i{font-style:normal;font-size:10px;font-weight:700;color:var(--sel);height:12px}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.days button[aria-pressed="true"] small,.days button[aria-pressed="true"] i{color:#C9CDD3}
.cal{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.calh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.calh b{font-family:var(--f-display);font-size:19px;font-weight:600}
.calh span{font-size:13px;color:var(--muted)}
.calh em{font-style:normal;font-size:13px;font-weight:700;color:var(--free)}
.gw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.g{min-width:calc(46px + var(--cols) * 58px)}
.gh,.gb{display:grid;grid-template-columns:46px repeat(var(--cols),minmax(58px,1fr))}
.gh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:4}
.gh div{padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;border-left:1px solid var(--grid)}
.gh div:first-child{border-left:0}
.gh small{font-size:11px;color:var(--muted)}
.gh b{font-size:17px;line-height:1.2}
.gh i{font-style:normal;font-size:10px;color:var(--muted)}
.gb{position:relative;padding-block:10px 12px}
.tm{position:relative;height:calc(var(--hrs) * var(--hh))}
.tm span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.col{position:relative;height:calc(var(--hrs) * var(--hh));border-left:1px solid var(--grid);cursor:pointer;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px);
  background-size:100% var(--hh),100% var(--hh);background-position:0 0,0 calc(var(--hh) / 2)}
.col:hover{background-color:#FCFDFD}
.past{position:absolute;left:0;right:0;top:0;background:var(--past);z-index:1;pointer-events:none}
.bk{position:absolute;left:3px;right:3px;border-radius:7px;background:var(--busy);color:var(--busy-ink);padding:4px 6px;font-size:11px;line-height:1.25;overflow:hidden;z-index:2;cursor:not-allowed}
.bk b{display:block;font-size:12px;font-weight:700}
.fr{position:absolute;left:8px;font-size:11px;font-weight:600;color:#9AA3AD;pointer-events:none;z-index:1;margin-top:5px}
.sw.c{background:linear-gradient(90deg,#616161 0 20%,#7986CB 20% 40%,#F09300 40% 60%,#33B679 60% 80%,#039BE5 80%);border:0}
.bk.fe{background:repeating-linear-gradient(135deg,#E2E5E9 0 4px,#F4F5F7 4px 8px);color:#5B616B}
.sl{position:absolute;left:3px;right:3px;border-radius:7px;background:var(--sel);color:#fff;padding:4px 6px;font-size:11px;line-height:1.25;z-index:3;box-shadow:0 4px 12px rgba(31,63,191,.3);overflow:hidden}
.sl b{display:block;font-size:12px}
.gh-ghost{position:absolute;left:3px;right:3px;border:2px dashed var(--free);background:var(--free-soft);border-radius:7px;color:var(--free);font-size:11px;font-weight:700;padding:3px 6px;z-index:2;pointer-events:none}
.now{position:absolute;left:46px;right:0;height:2px;background:var(--now);z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.bar small{display:block;font-size:12px;color:#C9CDD3}
.bar strong{font-size:16px}
.bar .hint{color:#E4E6EA;font-size:15px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bar .seg{background:#2A2E35}
.bar .seg button{color:#fff;min-height:36px;padding:0 12px}
.bar .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.bar .seg button[disabled]{opacity:.3;cursor:not-allowed}
.bar .seg .dv{display:inline-flex;align-items:center;justify-content:center;min-width:64px;font-weight:700;font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
.bar .seg button[data-act="dur"]{font-size:20px;min-width:44px}
.pop{position:absolute;z-index:8;width:min(264px, calc(100% - 52px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(22,24,29,.18);padding:12px;display:flex;flex-direction:column;gap:10px}
.pop-x{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.pop-x:hover{background:#F1F2F4}
.pop-t{font-size:12px;color:var(--muted);padding-right:30px}
.pop-h{font-size:14px;line-height:1.35}
.pop-h b{font-size:18px;font-variant-numeric:tabular-nums}
.pop-r{display:flex;align-items:center;justify-content:space-between;background:#F1F2F4;border-radius:12px;padding:4px}
.pop-r button{width:48px;height:44px;border:0;border-radius:9px;background:#fff;font-size:22px;font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pop-r button[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.pop-r span{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pop-wa{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:#1F8F4E;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.pop-wa:hover{background:#18763F}
.iv{position:absolute;left:3px;right:3px;z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(150,156,166,.16) 0 4px,transparent 4px 8px)}
.wa{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none}
.x{min-height:44px;padding:0 10px;border:0;background:transparent;color:#C9CDD3;font-weight:600}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2A2E35;color:#fff;font-size:14px;padding:10px 14px;border-radius:10px;z-index:20;max-width:calc(100% - 32px)}
.foot{font-size:12px;color:var(--muted)}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nav{display:inline-flex;gap:6px}
.nav button{width:38px;height:38px;border-radius:10px;border:1px solid #D5D9DF;background:#fff;font-weight:700}
.nav button[disabled]{opacity:.3;cursor:default}
.wk{--hw:34px;min-width:calc(40px + 7 * 116px)}
.wkh,.wkb{display:grid;grid-template-columns:40px repeat(7,minmax(116px,1fr))}
.wkh{position:sticky;top:0;background:#fff;z-index:4;border-bottom:1px solid var(--line)}
.wkh>div{border-left:1px solid var(--grid);padding:8px 3px 6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.wkh>div:first-child{border-left:0}
.wdh{border:0;background:transparent;text-align:left;padding:2px 3px;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.wdh:hover{background:#F4F5F7}
.wdh small{font-size:11px;color:var(--muted);text-transform:capitalize}
.wdh b{font-size:16px}
.wdh b i{font-style:normal;font-size:10px;font-weight:700;color:var(--sel);margin-left:4px}
.pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.pill.q{background:#FDE7E5;color:#A3241B}.pill.m{background:#FFF1E0;color:#8A4500}.pill.v{visibility:hidden}
.ug,.lbl{display:flex;gap:1px;padding-inline:2px}
.ug span{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:2px solid var(--line);padding-top:2px}
.lbl span{flex:1;text-align:center;font-size:9.5px;font-weight:700;color:#3A3F47}
.sep{flex:0 0 5px!important;border:0!important}
.wkb{position:relative;padding-block:8px 10px}
.tm2{position:relative;height:calc(12 * var(--hw))}
.tm2 span{position:absolute;right:5px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wd{position:relative;display:flex;gap:1px;padding-inline:2px;height:calc(12 * var(--hw));border-left:1px solid var(--grid);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% var(--hw)}
.ln{flex:1;position:relative;cursor:pointer;border-radius:3px;min-width:0}
.ln:hover{background:var(--free-soft);box-shadow:inset 0 0 0 1px var(--free)}
.ln i{position:absolute;left:0;right:0;border-radius:3px}
.ln i.fe{background:repeating-linear-gradient(135deg,#E2E5E9 0 3px,#F4F5F7 3px 6px)}
.wd .past{z-index:2}
.wd .now{left:0;z-index:5}
.wd .now::before{left:-4px;top:-3px;width:8px;height:8px}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:10px}
.moh{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px;text-transform:capitalize}
.md{min-height:104px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.md:hover:not([disabled]){border-color:#9AA3AD;box-shadow:0 2px 8px rgba(22,24,29,.08)}
.md[disabled]{background:#F7F8FA;color:#B0B5BC;cursor:default}
.md.out{border:0;background:transparent}
.md .n{font-weight:700;font-size:14px;line-height:1}
.md .n.hj{color:var(--sel)}
.md .n small{font-size:9.5px;font-weight:700;text-transform:uppercase}
.md .pill{font-size:9.5px;padding:1px 5px}
.mini{display:flex;gap:2px;height:48px;margin-top:auto}
.ml{flex:1;position:relative;background:#fff;box-shadow:inset 0 0 0 1px #E3E6EA;border-radius:2px;overflow:hidden;min-width:0}
.ml i{position:absolute;left:0;right:0}
.mini .sep{flex:0 0 3px}
@media (max-width:600px){.mo{gap:3px;padding:6px}.md{min-height:80px;padding:4px;border-radius:8px}.md .pill{display:none}.mini{gap:1px;height:40px}.mini .sep{flex-basis:2px}.md .n small{display:none}}
html,body{max-width:100%;overflow-x:hidden}
.wm{display:flex;flex-direction:column;gap:12px;padding:12px}
.wm-day{border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px}
.wm-dh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:6px}
.wm-dh button{border:0;background:none;padding:0;text-align:left;font-size:17px;font-weight:700;text-transform:none}
.wm-dh button i{font-style:normal;font-size:11px;font-weight:700;color:var(--sel);margin-left:6px}
.wm-dh .pill{font-size:11px}
.wm-scale{position:relative;height:16px;margin-left:46px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wm-scale span{position:absolute;top:0;transform:translateX(-50%)}
.wm-scale span:first-child{transform:none}.wm-scale span:last-child{transform:translateX(-100%)}
.wm-un{font-size:11.5px;font-weight:600;color:var(--muted);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.wm-row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:3px 0;min-height:34px;cursor:pointer}
.wm-lbl{flex:0 0 38px;font-weight:700;font-size:14px;text-align:left;border-left:4px solid;padding-left:6px;line-height:1.1}
.wm-bar{position:relative;flex:1;height:24px;border-radius:6px;overflow:hidden;background-color:#fff;box-shadow:inset 0 0 0 1px #DADDE2;
  background-image:linear-gradient(90deg,#EEF0F2 1px,transparent 1px);background-size:calc(100% / 12) 100%}
.wm-bar i{position:absolute;top:0;bottom:0}
.wm-bar i.fe{background:repeating-linear-gradient(135deg,#E2E5E9 0 3px,#F4F5F7 3px 6px)}
.wm-bar .past{position:absolute;left:0;top:0;bottom:0;background:rgba(246,247,248,.82);z-index:1}
.wm-row:active .wm-bar{box-shadow:inset 0 0 0 2px var(--free)}
@media (max-width:640px){.seg button{min-height:44px;font-size:15px;padding:0 18px}.nav button{width:44px;height:44px;font-size:18px}.legend{font-size:13px}.days button{width:66px;min-height:70px}}
@media (max-width:600px){.top h1{font-size:23px}.bar strong{font-size:15px}.bar .hint{font-size:14px}.bk b,.sl b+span{display:none!important}.bk{padding:4px;font-size:10.5px}.calh span{display:block}}
@media (prefers-reduced-motion:no-preference){.sl{transition:top .12s,height .12s}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="top"><h1>Agenda de horários</h1><p>Carregando a agenda…</p></div></div>

<script>
(function () {
  var WA = '5511995540293';
  var HI = 9, HF = 21, HH = 56;
  var UN = {
    aclimacao: { nome: 'Aclimação', end: 'Rua Gualaxo, 206', est: [['A', ''], ['B', ''], ['C', ''], ['D', ''], ['AB', 'A + B']] },
    belavista: { nome: 'Bela Vista', end: 'Rua Santa Madalena, 46', est: [['1', ''], ['2', ''], ['3', '']] }
  };
  var DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var DOWL = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fromKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(k, n) { var d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function hoje() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }); }
  function agoraMin() { var t = new Date().toLocaleTimeString('en-GB', { timeZone: 'America/Sao_Paulo', hour12: false }).split(':'); return (+t[0]) * 60 + (+t[1]); }
  function dLong(k) { var d = fromKey(k); return DOWL[d.getDay()] + ', ' + d.getDate() + ' de ' + MES[d.getMonth()]; }
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }
  function dMsg(k) { var d = fromKey(k); return DOWL[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }

  var HOJE = hoje();

  /* ---------- dados: lidos do bot (/disponibilidade), sem nomes de clientes ---------- */
  var API = '/disponibilidade';
  // cores do Google Agenda: A, B e AB grafite · C lavanda · D flamingo · 1 manga · 2 sálvia · 3 pavão
  var COR = { A: '#616161', B: '#616161', AB: '#616161', C: '#7986CB', D: '#E67C73', '1': '#F09300', '2': '#33B679', '3': '#039BE5' };
  var COR_OUTRO = '#9AA0A6';
  function corDe(o) { return COR[o] || COR_OUTRO; }
  function corTexto(hex) { if (hex === '#F09300') return '#1F2328'; var r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16); return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#1F2328' : '#FFFFFF'; }
  var DATA = {}, CARREGADO = false, ERRO = false;
  function diaVazio() { return { aclimacao: { A: [], B: [], C: [], D: [], AB: [] }, belavista: { '1': [], '2': [], '3': [] } }; }
  function spKey(t) { return new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }); }
  function spMin(t) { var p = new Date(t).toLocaleTimeString('en-GB', { timeZone: 'America/Sao_Paulo', hour12: false }).split(':'); return (+p[0] % 24) * 60 + (+p[1]); }
  function converter(oc) {
    var D = {};
    Object.keys(oc || {}).forEach(function (u) {
      Object.keys(oc[u] || {}).forEach(function (e) {
        (oc[u][e] || []).forEach(function (it) {
          var ini = Date.parse(it.ini), fim = Date.parse(it.fim);
          if (!(fim > ini)) return;
          var k = spKey(ini), a = spMin(ini), dur = Math.round((fim - ini) / 60000);
          while (dur > 0) {
            var b = Math.min(a + dur, 24 * 60);
            D[k] = D[k] || diaVazio();
            if (D[k][u] && D[k][u][e]) D[k][u][e].push({ a: a, b: b, s: it.status || 'reservado', o: it.est || null });
            dur -= (b - a); a = 0; k = addDays(k, 1);
          }
        });
      });
    });
    return D;
  }
  function carregar() {
    fetch(API + '?inicio=' + HOJE + '&dias=61', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (d) { DATA = converter(d.ocupado); CARREGADO = true; ERRO = false; render(); })
      .catch(function () { ERRO = true; if (!CARREGADO) render(); });
  }
  function busy(k, u, e) { return (DATA[k] && DATA[k][u][e]) || []; }

  /* ---------- estado ---------- */
  var MAXD = addDays(HOJE, 60);
  var st = { view: 'geral', wk: 0, mo: 0, unit: 'aclimacao', day: HOJE, sel: null, dur: 120 };
  // regras: mínimo de 2h, de meia em meia hora, até 8h; 30 min de intervalo entre aluguéis
  var MINM = 120, MAXM = 480, PASSO = 30, INTERVALO = 30;
  function fmtDur(m) { var h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? pad(r) : ''); }

      else if (a === 'mo') { st.mo = Math.max(0, st.mo + (+v)); }
      else if (a === 'wk') { st.wk = Math.max(0, Math.min(8, st.wk + (+v))); }
      else if (a === 'openday') { st.view = 'dia'; st.day = v; st.sel = null; render(); window.scrollTo({ top: 0 }); return; }
      else if (a === 'day') { st.day = v; }
      else if (a === 'dur') { if (st.sel) { var nd = st.sel.d + (+v), okd = durs(st.sel.k, st.sel.u, st.sel.e, st.sel.a); if (okd.indexOf(nd) >= 0) { st.sel.d = nd; st.dur = nd; } } }
      else if (a === 'clear') { st.sel = null; }
      render();
      return;
    }
    var wr = ev.target.closest('.wm-row');
    if (wr) {
      var br = wr.querySelector('.wm-bar').getBoundingClientRect();
      var mx = HI * 60 + Math.floor(Math.max(0, ev.clientX - br.left) / br.width * (HF - HI) * 2) * 30;
      mx = Math.max(HI * 60, Math.min(HF * 60 - MINM, mx));
      st.view = 'dia'; st.day = wr.getAttribute('data-k'); st.unit = wr.getAttribute('data-u');
      var e3 = wr.getAttribute('data-e'), ok3 = durs(st.day, st.unit, e3, mx);
      st.sel = ok3.length ? { k: st.day, u: st.unit, e: e3, a: mx, d: ok3.indexOf(st.dur) >= 0 ? st.dur : ok3[0] } : null;
      render(); mostrarEscolha();
      if (!ok3.length) toast('Esse horário do Estúdio ' + e3 + ' está ocupado. Veja os espaços brancos.');
      return;
    }
    var ln = ev.target.closest('.ln');
    if (ln) {
      var r = ln.getBoundingClientRect(), mm = HI * 60 + Math.floor((ev.clientY - r.top) / 34 * 2) * 30;
      mm = Math.max(HI * 60, Math.min(HF * 60 - MINM, mm));
      st.view = 'dia'; st.day = ln.getAttribute('data-k'); st.unit = ln.getAttribute('data-u');
      var e2 = ln.getAttribute('data-e'), ok2 = durs(st.day, st.unit, e2, mm);
      st.sel = ok2.length ? { k: st.day, u: st.unit, e: e2, a: mm, d: ok2.indexOf(st.dur) >= 0 ? st.dur : ok2[0] } : null;
      render(); mostrarEscolha();
      if (!ok2.length) toast('Esse horário do Estúdio ' + e2 + ' está ocupado. Veja os espaços brancos.');
      return;
    }
    if (ev.target.closest('.bk')) { toast('Esse horário já está ocupado.'); return; }
    var col = ev.target.closest('.col');
    if (!col) return;
    var e = col.getAttribute('data-e'), m = slotFromEvent(ev, col);
    if (m < minStart(st.day)) { toast('Esse horário já passou.'); return; }
    var ok = durs(st.day, st.unit, e, m);
    if (!ok.length) { toast('Aqui não cabem 2 horas (mínimo de 2h, com 30 min de intervalo entre aluguéis). Escolha outro horário.'); return; }
    var d = ok.indexOf(st.dur) >= 0 ? st.dur : ok[ok.length - 1] < st.dur ? ok[ok.length - 1] : ok[0];
    st.sel = { k: st.day, u: st.unit, e: e, a: m, d: d };
    render();
  });

  // contorno verde ao passar o mouse (só no computador)
  var ghost = null;
  app.addEventListener('mousemove', function (ev) {
    var col = ev.target.closest('.col');
    if (!col || ev.target.closest('.bk') || ev.target.closest('.sl')) { if (ghost) { ghost.remove(); ghost = null; } return; }
    var e = col.getAttribute('data-e'), m = slotFromEvent(ev, col);
    var ok = durs(st.day, st.unit, e, m);
    if (!ok.length) { if (ghost) { ghost.remove(); ghost = null; } return; }
    var d = ok.indexOf(st.dur) >= 0 ? st.dur : ok[0];
    if (!ghost) { ghost = document.createElement('div'); ghost.className = 'gh-ghost'; }
    if (ghost.parentNode !== col) col.appendChild(ghost);
    ghost.style.top = ((m - HI * 60) / 60 * HH) + 'px';
    ghost.style.height = (d / 60 * HH - 2) + 'px';
    ghost.textContent = '+ ' + hm(m);
  });
  app.addEventListener('mouseleave', function () { if (ghost) { ghost.remove(); ghost = null; } });

  var eraCel = celular();
  window.addEventListener('resize', function () { if (celular() !== eraCel) { eraCel = celular(); if (CARREGADO) render(); } });
  render();
  carregar();
  setInterval(function () { if (!document.hidden) carregar(); }, 3 * 60 * 1000);
  setInterval(function () { if (!document.hidden && CARREGADO) render(); }, 60 * 1000);
})();
</script>
</body>
